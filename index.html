<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEH Mobile Logistics</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MEH Mobile">
    <meta name="theme-color" content="#111827">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2830/2830305.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2830/2830305.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
        .safe-area-top { padding-top: env(safe-area-inset-top); }
        .safe-area-bottom { padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
    </style>
</head>
<body class="bg-gray-50 h-full flex flex-col text-gray-900 overflow-hidden antialiased">
    
    <!-- MODAL DE LOGIN -->
    <div id="loginModal" class="fixed inset-0 bg-gray-900/95 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-5">
            <div class="text-center space-y-1">
                <div class="h-12 w-12 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h2 class="text-xl font-extrabold text-gray-900">Iniciar Sesión</h2>
                <p class="text-xs text-gray-500">Ingresa tus credenciales de piloto MEH</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-bold text-gray-600 uppercase tracking-wider block mb-1">Piloto / Usuario</label>
                    <select id="loginPiloto" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold text-gray-800 focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">Cargando usuarios...</option>
                    </select>
                </div>

                <div>
                    <label class="text-[11px] font-bold text-gray-600 uppercase tracking-wider block mb-1">Contraseña / PIN</label>
                    <input type="password" id="loginPIN" placeholder="****" maxlength="8" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold text-gray-800 focus:ring-2 focus:ring-emerald-500 outline-none tracking-widest text-center">
                </div>
            </div>

            <button onclick="validarLogin()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-emerald-700 active:scale-95 transition-all text-sm">
                Ingresar a la Ruta
            </button>
        </div>
    </div>

    <!-- MODAL DE GESTIÓN DE INCIDENCIA Y REPROGRAMACIÓN -->
    <div id="gestionModal" class="fixed inset-0 bg-gray-900/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <h3 class="font-bold text-gray-900 text-sm"><i class="fas fa-tasks text-emerald-600 mr-1.5"></i>Gestionar Estado de Guía</h3>
                <button onclick="cerrarModalGestion()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="space-y-3">
                <p class="text-xs text-gray-500">Guía: <span id="modalGuiaLabel" class="font-bold text-indigo-900"></span></p>

                <!-- ESTATUS PRINCIPAL -->
                <div>
                    <label class="text-[11px] font-bold text-gray-700 uppercase block mb-1">Estatus *</label>
                    <select id="selectEstatus" onchange="actualizarSubEstatus()" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-xs font-semibold text-gray-800 focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">Selecciona Estatus...</option>
                    </select>
                </div>

                <!-- SUB ESTATUS (DEPENDIENTE) -->
                <div>
                    <label class="text-[11px] font-bold text-gray-700 uppercase block mb-1">Sub Estatus *</label>
                    <select id="selectSubEstatus" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-xs font-semibold text-gray-800 focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="">Selecciona primero un Estatus...</option>
                    </select>
                </div>

                <!-- FECHA (Solo visible para REPROGRAMADO) -->
                <div id="contenedorFechaReprogramado" class="hidden">
                    <label class="text-[11px] font-bold text-amber-700 uppercase block mb-1">Nueva Fecha de Entrega *</label>
                    <input type="date" id="inputNuevaFecha" class="w-full bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-xs font-semibold text-gray-800 focus:ring-2 focus:ring-amber-500 outline-none">
                </div>

                <!-- BITÁCORA (OBLIGATORIA) -->
                <div>
                    <label class="text-[11px] font-bold text-gray-700 uppercase block mb-1">Bitácora / Motivo *</label>
                    <textarea id="inputBitacora" rows="3" placeholder="Escribe la observación obligatoria..." class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-xs text-gray-800 focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
                    <p class="text-[10px] text-gray-400 mt-1"><i class="fas fa-info-circle mr-1"></i>Esta nota sobreescribirá la bitácora anterior.</p>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
                <button onclick="cerrarModalGestion()" class="px-4 py-2 bg-gray-100 text-gray-700 font-semibold rounded-xl text-xs">Cancelar</button>
                <button onclick="guardarGestion()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs active:scale-95 shadow-md">Guardar Estatus</button>
            </div>
        </div>
    </div>

    <!-- Header principal -->
    <header class="bg-gray-900 text-gray-100 safe-area-top shadow-md z-40">
        <div class="px-5 pt-4 pb-3 flex items-center justify-between">
            <h1 class="text-2xl font-extrabold tracking-tight text-white">MEH MOBILE</h1>
            <button onclick="cerrarSesion()" class="text-xs text-gray-400 hover:text-red-400 flex items-center gap-1">
                <i class="fas fa-sign-out-alt"></i> Salir
            </button>
        </div>
    </header>
    
    <!-- Sub-header de Estado -->
    <section class="bg-gray-900/95 text-gray-200 border-t border-gray-800 z-30">
        <div class="px-5 py-3 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span id="rutaLabel" class="text-xs font-bold tracking-tight text-emerald-400 uppercase">SIN PILOTO</span>
            </div>
            
            <div class="flex items-center gap-1.5 text-[11px] bg-emerald-950/80 text-emerald-300 px-2.5 py-1 rounded-lg border border-emerald-800">
                <i class="fas fa-calendar-alt text-emerald-400"></i>
                <span id="fechaHoyLabel">HOY</span>
            </div>
        </div>
    </section>

    <!-- Resumen de Métricas -->
    <div class="bg-gray-900 text-white px-5 pb-4 pt-1 shadow-md">
        <div class="flex justify-between text-xs text-gray-400 mb-1">
            <span>Progreso de Entregas</span>
            <span id="progresoTexto">0 / 0 (0%)</span>
        </div>
        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
            <div id="barraProgreso" class="bg-emerald-500 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <div class="mt-3 flex justify-between items-center text-xs">
            <span class="text-gray-400">Efectivo Cobrado (COD):</span>
            <span id="totalCOD" class="font-bold text-emerald-400 text-sm">L. 0.00</span>
        </div>
    </div>

    <!-- Lista de Guías Asignadas -->
    <main class="flex-1 overflow-y-auto p-4 space-y-3 pb-24" id="contenedorGuias">
        <div class="text-center text-gray-400 py-10">
            <i class="fas fa-spinner fa-spin text-2xl mb-2 text-emerald-500"></i>
            <p class="text-sm">Cargando guías asignadas...</p>
        </div>
    </main>

    <!-- Footer Fijo -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 safe-area-bottom z-50 shadow-lg">
        <div class="grid grid-cols-2 gap-3">
            <button onclick="cargarDatosBase()" class="flex items-center justify-center gap-2 bg-gray-100 text-gray-800 py-3 rounded-xl font-semibold active:scale-95 transition-all text-xs border border-gray-200">
                <i class="fas fa-sync-alt text-emerald-600"></i>
                <span>Actualizar Datos</span>
            </button>
            <button class="flex items-center justify-center gap-2 bg-emerald-600 text-white py-3 rounded-xl font-bold active:scale-95 transition-all text-xs shadow-md">
                <i class="fas fa-cash-register"></i>
                <span>Cierre de Caja</span>
            </button>
        </div>
    </footer>

    <!-- LÓGICA JAVASCRIPT PRINCIPAL -->
    <script>
        let pilotoSesion = localStorage.getItem('piloto_meh_activo') || '';
        let guiasAsignadas = [];
        let guiaSeleccionada = '';

        const mapaEstatusSubEstatus = {
            "EN RUTA": ["ALMACENADO", "CONFIRMADO POR EL CLIENTE", "NO CONTESTA LLAMADA"],
            "RECLAMO": ["RECLAMO"],
            "RECHAZADO": [
                "NO TIENE DINERO", "DUPLICADO", "NO HIZO PEDIDO", "PRECIO INCORRECTO", 
                "CAMBIO DE DIRECCIÓN", "FUERA DE TIEMPO", "NUMERO INCORRECTO", "ERROR EN PRODUCTO", 
                "RECHAZADO CC", "TIEMPO DE ESPERA", "COMPRA OTRO PRODUCTO", "NADIE EN CASA", "YA NO DESEA PRODUCTO"
            ],
            "FUERA DE COBERTURA": ["AGENCIA FUERA DE COBERTURA"],
            "AGENCIA": ["AGENCIA A PETICIÓN DE CLIENTE", "DIRECTO AGENCIA"],
            "PUNTO DE ENCUENTRO": ["PUNTO DE ENCUENTRO PETICIÓN DEL CLIENTE"],
            "DIRECCIÓN INCORRECTA / INCOMPLETA": ["DIRECCIÓN INCORRECTA", "DIRECCIÓN INCOMPLETA"],
            "REPROGRAMADO": ["CONFIRMADO NUEVA FECHA", "ALMACENADO", "REPROGRAMADO CC"],
            "EN RUTA PARA DEVOLUCIÓN": ["EN RUTA PARA DEVOLUCIÓN"],
            "RETORNADO A WEBCORP": ["COMPLETO", "INCOMPLETO"],
            "EN GESTION": ["ENTREGADO"]
        };

        const usuariosDB = [
            { USERS: "Mario SPS", PASSWORD: "1123", "ACTIVE?": "TRUE" },
            { USERS: "Wuilmer PGRS", PASSWORD: "1122", "ACTIVE?": "TRUE" },
            { USERS: "Milton CBA", PASSWORD: "1133", "ACTIVE?": "TRUE" },
            { USERS: "FRANKLIN CYA", PASSWORD: "1132", "ACTIVE?": "TRUE" },
            { USERS: "JUAN CTA", PASSWORD: "1153", "ACTIVE?": "TRUE" },
            { USERS: "ROBERTO CHO", PASSWORD: "1152", "ACTIVE?": "TRUE" },
            { USERS: "LUIS TOCOA", PASSWORD: "1163", "ACTIVE?": "TRUE" },
            { USERS: "OSCAR", PASSWORD: "1162", "ACTIVE?": "TRUE" },
            { USERS: "OLVIN EL PARAISO", PASSWORD: "1185", "ACTIVE?": "TRUE" },
            { USERS: "ESTEVIN CHOL", PASSWORD: "1189", "ACTIVE?": "TRUE" },
            { USERS: "EDUARDO CHA/CO", PASSWORD: "1187", "ACTIVE?": "TRUE" },
            { USERS: "WILLY", PASSWORD: "1185", "ACTIVE?": "TRUE" },
            { USERS: "DENIS", PASSWORD: "1145", "ACTIVE?": "TRUE" },
            { USERS: "ALEXANDER", PASSWORD: "1149", "ACTIVE?": "TRUE" },
            { USERS: "SELVIN", PASSWORD: "2235", "ACTIVE?": "TRUE" },
            { USERS: "RICARDO", PASSWORD: "4152", "ACTIVE?": "TRUE" },
            { USERS: "MARVIN", PASSWORD: "5566", "ACTIVE?": "FALSE" }
        ];

        window.onload = () => {
            poblarSelectUsuarios();
            poblarSelectEstatus();
            
            const hoy = new Date();
            const dia = String(hoy.getDate()).padStart(2, '0');
            const mes = String(hoy.getMonth() + 1).padStart(2, '0');
            document.getElementById('fechaHoyLabel').innerText = `${dia}/${mes}/${hoy.getFullYear()}`;

            if (pilotoSesion) {
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('rutaLabel').innerText = `PILOTO: ${pilotoSesion}`;
                cargarDatosBase();
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
            }
        };

        // DETECCION DE COORDENADAS EN "REF DE DIRECCIÓN"
        function obtenerLinkWaze(refDireccion, direccionTexto, municipioTexto) {
            // Regex para detectar patrones lat,lng (ej: 13.3021, -87.1941 o 15.5042,-88.0250)
            const regexGps = /(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/;
            
            // Evalúa primero REF DE DIRECCIÓN
            const matchRef = refDireccion ? String(refDireccion).match(regexGps) : null;
            // Evaluación secundaria por si viniera en DIRECCION
            const matchDir = direccionTexto ? String(direccionTexto).match(regexGps) : null;

            const match = matchRef || matchDir;

            if (match) {
                const lat = match[1];
                const lng = match[2];
                return {
                    url: `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`,
                    esGpsDirecto: true
                };
            } else {
                // Si solo hay texto, hace la búsqueda por dirección y municipio en Waze
                const busqueda = encodeURIComponent(`${direccionTexto || ''} ${municipioTexto || ''}`.trim());
                return {
                    url: `https://waze.com/ul?q=${busqueda}&navigate=yes`,
                    esGpsDirecto: false
                };
            }
        }

        function poblarSelectUsuarios() {
            const select = document.getElementById('loginPiloto');
            select.innerHTML = '<option value="">Selecciona tu usuario...</option>';
            usuariosDB.filter(u => u["ACTIVE?"] === "TRUE").forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.USERS;
                opt.textContent = u.USERS;
                select.appendChild(opt);
            });
        }

        function poblarSelectEstatus() {
            const select = document.getElementById('selectEstatus');
            select.innerHTML = '<option value="">Selecciona Estatus...</option>';
            Object.keys(mapaEstatusSubEstatus).forEach(estatus => {
                const opt = document.createElement('option');
                opt.value = estatus;
                opt.textContent = estatus;
                select.appendChild(opt);
            });
        }

        function actualizarSubEstatus() {
            const estatusSeleccionado = document.getElementById('selectEstatus').value;
            const selectSub = document.getElementById('selectSubEstatus');
            const contFecha = document.getElementById('contenedorFechaReprogramado');

            selectSub.innerHTML = '<option value="">Selecciona Sub Estatus...</option>';

            if (estatusSeleccionado && mapaEstatusSubEstatus[estatusSeleccionado]) {
                mapaEstatusSubEstatus[estatusSeleccionado].forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub;
                    opt.textContent = sub;
                    selectSub.appendChild(opt);
                });
            }

            if (estatusSeleccionado === "REPROGRAMADO") {
                contFecha.classList.remove('hidden');
            } else {
                contFecha.classList.add('hidden');
            }
        }

        function validarLogin() {
            const user = document.getElementById('loginPiloto').value;
            const pass = document.getElementById('loginPIN').value.trim();

            if (!user || !pass) {
                alert('Selecciona tu usuario e ingresa tu PIN.');
                return;
            }

            const match = usuariosDB.find(u => u.USERS === user && u.PASSWORD === pass && u["ACTIVE?"] === "TRUE");

            if (match) {
                localStorage.setItem('piloto_meh_activo', match.USERS);
                pilotoSesion = match.USERS;
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('rutaLabel').innerText = `PILOTO: ${pilotoSesion}`;
                cargarDatosBase();
            } else {
                alert('Contraseña incorrecta o usuario inactivo.');
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('piloto_meh_activo');
            location.reload();
        }

        function cargarDatosBase() {
            const hoy = new Date();
            const dia = String(hoy.getDate()).padStart(2, '0');
            const mes = String(hoy.getMonth() + 1).padStart(2, '0');
            const anio = hoy.getFullYear();

            const fechaHoyFormat1 = `${anio}-${mes}-${dia}`;
            const fechaHoyFormat2 = `${dia}/${mes}/${anio}`;

            // Datos de prueba basándonos en tu hoja oficial
            const datosBrutos = [
                {
                    "GUIA": "G-88496",
                    "DESTINATARIO": "Cliente Choluteca",
                    "DIRECCION": "Barrio Brasil",
                    "MUNICIPIO": "Choluteca",
                    "TELEFONO": "99998888",
                    "COD": "0",
                    "PILOTO": "Mario SPS",
                    "REPROGRAMADO": fechaHoyFormat2,
                    "STATUS": "EN RUTA",
                    "SUB STATUS": "CONFIRMADO POR EL CLIENTE",
                    "REF DE DIRECCIÓN": "barrio brasil, cerca de la iglesia (13.3021, -87.1941)",
                    "BITACORA": ""
                },
                {
                    "GUIA": "G-88498",
                    "DESTINATARIO": "Farmacia La Salud",
                    "DIRECCION": "Barrio Concepción, 1 Calle 3 Ave",
                    "MUNICIPIO": "San Pedro Sula",
                    "TELEFONO": "88887777",
                    "COD": "450.00",
                    "PILOTO": "Mario SPS",
                    "REPROGRAMADO": fechaHoyFormat2,
                    "STATUS": "EN RUTA",
                    "SUB STATUS": "CONFIRMADO POR EL CLIENTE",
                    "REF DE DIRECCIÓN": "Atras del seguro social",
                    "BITACORA": ""
                }
            ];

            guiasAsignadas = datosBrutos.filter(g => {
                const esMismoPiloto = g.PILOTO === pilotoSesion;
                const fechaRep = g.REPROGRAMADO ? String(g.REPROGRAMADO).trim() : '';
                const esParaHoy = fechaRep === fechaHoyFormat1 || fechaRep === fechaHoyFormat2 || fechaRep.includes(`${dia}/${mes}`);
                return esMismoPiloto && esParaHoy;
            });

            renderizarGuias();
        }

        function renderizarGuias() {
            const contenedor = document.getElementById('contenedorGuias');
            if (guiasAsignadas.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center text-gray-400 py-12">
                        <i class="fas fa-box-open text-4xl mb-3 text-gray-300"></i>
                        <p class="text-base font-semibold text-gray-600">Sin ordenes para hoy</p>
                        <p class="text-xs text-gray-400 mt-1">No hay guías asignadas a ${pilotoSesion} para esta fecha.</p>
                    </div>`;
                return;
            }

            let html = '';
            let completadas = 0;
            let totalCOD = 0;

            guiasAsignadas.forEach(g => {
                const esEntregado = g.STATUS === 'EN GESTION' && g['SUB STATUS'] === 'ENTREGADO';
                if (esEntregado) completadas++;
                if (g.COD) totalCOD += parseFloat(g.COD) || 0;

                // Extrae coordenadas prioritariamente del campo 'REF DE DIRECCIÓN'
                const datosWaze = obtenerLinkWaze(g['REF DE DIRECCIÓN'], g.DIRECCION, g.MUNICIPIO);

                html += `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-2">
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-bold text-indigo-900 bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100">${g.GUIA}</span>
                        <div class="text-right">
                            <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full ${esEntregado ? 'bg-emerald-100 text-emerald-700' : 'bg-gray-100 text-gray-700'}">
                                ${g.STATUS || 'EN RUTA'}
                            </span>
                            ${g['SUB STATUS'] ? `<p class="text-[9px] text-gray-500 font-semibold mt-0.5">${g['SUB STATUS']}</p>` : ''}
                        </div>
                    </div>

                    <h3 class="font-bold text-gray-900 text-sm">${g.DESTINATARIO}</h3>
                    
                    <p class="text-xs text-gray-600 flex items-start gap-1.5">
                        <i class="fas fa-map-marker-alt text-red-500 mt-0.5 shrink-0"></i>
                        <span>${g.DIRECCION} ${g.MUNICIPIO ? ', ' + g.MUNICIPIO : ''}</span>
                    </p>

                    ${g['REF DE DIRECCIÓN'] ? `<p class="text-[11px] text-gray-500 bg-gray-50 p-2 rounded-lg italic border border-gray-100"><i class="fas fa-info-circle text-blue-500 mr-1"></i>${g['REF DE DIRECCIÓN']}</p>` : ''}

                    ${g.BITACORA ? `<p class="text-[11px] text-amber-800 bg-amber-50 p-2 rounded-lg border border-amber-100"><i class="fas fa-edit text-amber-600 mr-1"></i><b>Bitácora:</b> ${g.BITACORA}</p>` : ''}

                    <div class="pt-2 flex items-center justify-between border-t border-gray-100 text-xs">
                        <span class="font-semibold text-gray-700">${g.COD && parseFloat(g.COD) > 0 ? 'COD: L. ' + g.COD : 'Sin Cobro'}</span>
                        <div class="flex gap-2">
                            <!-- Botón de Waze enfocado en REF DE DIRECCIÓN -->
                            <a href="${datosWaze.url}" target="_blank" class="p-2 ${datosWaze.esGpsDirecto ? 'bg-sky-500 text-white font-bold' : 'bg-sky-100 text-sky-700'} rounded-xl hover:bg-sky-600 hover:text-white transition-all flex items-center gap-1" title="${datosWaze.esGpsDirecto ? 'GPS exacto desde Ref. Dirección' : 'Buscar en Waze'}">
                                <i class="fa-brands fa-waze text-sm"></i>
                                ${datosWaze.esGpsDirecto ? '<span class="text-[10px] font-black uppercase">GPS</span>' : ''}
                            </a>
                            <a href="tel:${g.TELEFONO}" class="p-2 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200"><i class="fas fa-phone"></i></a>
                            <button onclick="abrirModalGestion('${g.GUIA}')" class="px-3 py-1.5 bg-indigo-600 text-white font-bold rounded-xl text-xs active:scale-95 shadow-sm">Gestionar</button>
                        </div>
                    </div>
                </div>`;
            });

            contenedor.innerHTML = html;

            const pct = Math.round((completadas / guiasAsignadas.length) * 100) || 0;
            document.getElementById('progresoTexto').innerText = `${completadas} / ${guiasAsignadas.length} (${pct}%)`;
            document.getElementById('barraProgreso').style.width = `${pct}%`;
            document.getElementById('totalCOD').innerText = `L. ${totalCOD.toFixed(2)}`;
        }

        function abrirModalGestion(guia) {
            guiaSeleccionada = guia;
            const item = guiasAsignadas.find(g => g.GUIA === guia);

            document.getElementById('modalGuiaLabel').innerText = guia;
            document.getElementById('selectEstatus').value = item.STATUS || '';
            actualizarSubEstatus();
            document.getElementById('selectSubEstatus').value = item['SUB STATUS'] || '';
            document.getElementById('inputBitacora').value = item.BITACORA || '';

            const manana = new Date();
            manana.setDate(manana.getDate() + 1);
            const yyyy = manana.getFullYear();
            const mm = String(manana.getMonth() + 1).padStart(2, '0');
            const dd = String(manana.getDate()).padStart(2, '0');
            document.getElementById('inputNuevaFecha').value = `${yyyy}-${mm}-${dd}`;

            document.getElementById('gestionModal').classList.remove('hidden');
        }

        function cerrarModalGestion() {
            guiaSeleccionada = '';
            document.getElementById('gestionModal').classList.add('hidden');
        }

        function guardarGestion() {
            const estatus = document.getElementById('selectEstatus').value;
            const subEstatus = document.getElementById('selectSubEstatus').value;
            const bitacora = document.getElementById('inputBitacora').value.trim();
            const nuevaFecha = document.getElementById('inputNuevaFecha').value;

            if (!estatus) {
                alert('⚠️ Selecciona un Estatus.');
                return;
            }
            if (!subEstatus) {
                alert('⚠️ Selecciona un Sub Estatus.');
                return;
            }
            if (!bitacora) {
                alert('⚠️ La Bitácora es OBLIGATORIA para detallar la observación.');
                return;
            }

            const item = guiasAsignadas.find(g => g.GUIA === guiaSeleccionada);

            if (item) {
                item.STATUS = estatus;
                item['SUB STATUS'] = subEstatus;
                item.BITACORA = bitacora;

                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        console.log(`GPS Registrado: ${pos.coords.latitude}, ${pos.coords.longitude}`);
                    });
                }

                if (estatus === "REPROGRAMADO") {
                    if (!nuevaFecha) {
                        alert('⚠️ Selecciona la nueva fecha de reprogramación.');
                        return;
                    }
                    const partes = nuevaFecha.split('-');
                    item.REPROGRAMADO = `${partes[2]}/${partes[1]}/${partes[0]}`;
                    alert(`✅ Guía ${guiaSeleccionada} reprogramada para el ${item.REPROGRAMADO}`);
                    cerrarModalGestion();
                    cargarDatosBase();
                    return;
                }

                alert(`✅ Guía ${guiaSeleccionada} actualizada a [${estatus} - ${subEstatus}]`);
            }

            cerrarModalGestion();
            renderizarGuias();
        }
    </script>
</body>
</html>
